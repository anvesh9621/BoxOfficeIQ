version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: boxofficeiq_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: boxofficeiq
      POSTGRES_USER: boxofficeiq
      POSTGRES_PASSWORD: boxofficeiq_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boxofficeiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boxofficeiq_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml/data:/ml/data
      - ./models:/models
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
